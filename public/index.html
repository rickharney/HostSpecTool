<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGW Host Spec Tool</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background: white;
            width: 700px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,.12);
        }

        h1 {
            color: #0078d4;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #0078d4;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #fafcff;
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        button:hover {
            background: #106ebe;
        }

        .result {
            margin-top: 20px;
        }

        .success {
            background: #dff6dd;
            color: #107c10;
            padding: 15px;
            border-radius: 6px;
        }

        .error {
            background: #fde7e9;
            color: #a80000;
            padding: 15px;
            border-radius: 6px;
        }

        a {
            color: #0078d4;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        #loading {
            display: none;
            color: #0078d4;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>TGW Host Spec Tool</h1>

    <p class="subtitle">
        Upload an OpenAPI 3.x YAML file and generate Redocly HTML documentation.
    </p>

    <form id="uploadForm">

        <div class="upload-box">
            <input type="file" name="yaml" accept=".yaml,.yml" required>
            <br>
            <button type="submit">
                Generate Documentation
            </button>
        </div>

    </form>

    <div id="loading">
        Generating documentation...
    </div>

    <div id="result" class="result"></div>

    <div class="footer">
        Powered by Redocly + Node.js
    </div>

</div>

<script>

document
    .getElementById("uploadForm")
    .addEventListener("submit", async (e) => {

        e.preventDefault();

        const formData = new FormData(e.target);

        document.getElementById("loading").style.display = "block";
        document.getElementById("result").innerHTML = "";

        try {

            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            document.getElementById("loading").style.display = "none";

            if (result.success) {

                document.getElementById("result").innerHTML = `
                    <div class="success">
                        ✅ Documentation generated successfully.<br><br>
                        <a href="${result.url}" target="_blank">
                            Open Documentation
                        </a>
                    </div>
                `;
            }
            else {

                document.getElementById("result").innerHTML = `
                    <div class="error">
                        ❌ ${result.error}
                    </div>
                `;
            }

        } catch (err) {

            document.getElementById("loading").style.display = "none";

            document.getElementById("result").innerHTML = `
                <div class="error">
                    ❌ ${err.message}
                </div>
            `;
        }

    });

</script>

</body>
</html>
